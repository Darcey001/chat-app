name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Server tests
        working-directory: server
        run: |
          npm install
          npm test

      - name: Client build
        working-directory: client
        run: |
          npm install
          npm run build
